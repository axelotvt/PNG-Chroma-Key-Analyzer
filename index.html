<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chroma Key Color Analyzer</title>

<style>
body{ 
    font-family:Arial, Helvetica, sans-serif;
    background:#1e1e1e;
    color:white;
    margin:0;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
}

.upload-box{
    border:2px dashed #555;
    padding:30px;
    text-align:center;
    border-radius:12px;
    margin-bottom:30px;
    background:#2a2a2a;
}

input[type=file]{
    padding:10px;
}

.preview-area{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
    margin-top:20px;
}

.preview{
    flex:1;
    min-width:300px;
}

.preview img{
    max-width:100%;
    border-radius:10px;
    background: repeating-conic-gradient(#666 0% 25%, #444 0% 50%) 50% / 20px 20px;
}

.result{
    flex:1;
    min-width:250px;
    background:#2a2a2a;
    padding:20px;
    border-radius:10px;
}

.color-box{
    width:100%;
    height:120px;
    border-radius:10px;
    margin-top:10px;
    border:2px solid white;
}

.hex{
    font-size:24px;
    margin-top:15px;
    font-weight:bold;
}

.reason{
    margin-top:15px;
    color:#ccc;
}

canvas{
    display:none;
}
</style>
</head>
<body>

<div class="container">

<h1>PNG Chroma Key Analyzer</h1>

<div class="upload-box">
    <input type="file" id="imageInput" accept="image/png,image/*">
</div>

<div class="preview-area">

    <div class="preview">
        <img id="previewImage" />
    </div>

    <div class="result">
        <h2>Recommended Chroma Color</h2>

        <div class="color-box" id="colorBox"></div>

        <div class="hex" id="hexCode">Upload an image</div>

        <div class="reason" id="reason"></div>
    </div>

</div>

<canvas id="canvas"></canvas>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const previewImage = document.getElementById("previewImage");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const colorBox = document.getElementById("colorBox");
const hexCode = document.getElementById("hexCode");
const reason = document.getElementById("reason");

imageInput.addEventListener("change", e => {

    const file = e.target.files[0];
    if(!file) return;

    // RESET EVERYTHING

    previewImage.src = "";

    colorBox.style.background = "transparent";

    hexCode.textContent = "Analyzing...";

    reason.textContent = "";

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.width = 1;
    canvas.height = 1;

    // LOAD NEW IMAGE

    const reader = new FileReader();

    reader.onload = event => {

        previewImage.src = event.target.result;

        previewImage.onload = () => {
            analyzeImage(previewImage);
        };
    };

    reader.readAsDataURL(file);
});

function analyzeImage(img){

    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    ctx.drawImage(img,0,0);

    const pixels = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    ).data;

    const sampledColors = [];

    // Sample image colors
    for(let i=0;i<pixels.length;i+=40){

        const r = pixels[i];
        const g = pixels[i+1];
        const b = pixels[i+2];
        const a = pixels[i+3];

        if(a < 20) continue;

        sampledColors.push([r,g,b]);
    }

    if(sampledColors.length === 0){
        return;
    }

    let bestColor = null;
    let bestScore = -1;

    // Search RGB space
    for(let r=0;r<=255;r+=16){
        for(let g=0;g<=255;g+=16){
            for(let b=0;b<=255;b+=16){

                const saturation =
                    Math.max(r,g,b) -
                    Math.min(r,g,b);

                // Prefer vibrant colors
                if(saturation < 120){
                    continue;
                }

                let closestDistance = Infinity;

                for(const c of sampledColors){

                    const dr = r - c[0];
                    const dg = g - c[1];
                    const db = b - c[2];

                    const dist =
                        dr*dr +
                        dg*dg +
                        db*db;

                    if(dist < closestDistance){
                        closestDistance = dist;
                    }
                }

                const score =
                    closestDistance +
                    saturation * 20;

                if(score > bestScore){

                    bestScore = score;

                    bestColor = {
                        r,g,b
                    };
                }
            }
        }
    }

    const hex =
        "#" +
        bestColor.r.toString(16).padStart(2,"0") +
        bestColor.g.toString(16).padStart(2,"0") +
        bestColor.b.toString(16).padStart(2,"0");

    colorBox.style.background = hex;

    hexCode.textContent = hex.toUpperCase();

    reason.innerHTML =
        `
        Recommended chroma color is the most distant vibrant color from the image palette.
        <br><br>
        RGB(${bestColor.r},
        ${bestColor.g},
        ${bestColor.b})
        `;
}

</script>

</body>
</html>
